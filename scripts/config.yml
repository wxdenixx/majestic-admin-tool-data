output:
  rules_dir: "rules"
  items_dir: "items"
  version_format: "%Y.%m.%d.%H%M"
  schema_version: "1"

guardrails:
  # Минимум правил, которое должно получиться в каждом разделе.
  # Если парсер извлёк меньше — workflow падает, файл НЕ коммитится.
  min_rules_per_section: 3
  # Максимальный процент правил без text — если текст пустой у >30%,
  # значит сломался селектор/регулярка, обновление отменяется.
  max_empty_text_ratio: 0.3
