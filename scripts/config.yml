# Majestic Admin Tool — scraper configuration.
#
# Каждый раздел форума раз в сутки конвертируется в отдельный JSON-пакет
# в rules/{id}.json. Имена файлов и ID пакетов стабильны между прогонами,
# чтобы ETag-кеш в тулсе работал корректно.
#
# Чтобы добавить новый раздел — просто дописать его в sections. Скрипт
# подхватит без изменения кода.

base_url: "https://forum.majestic-rp.ru"
user_agent: "majestic-admin-tool-scraper/0.4 (+https://github.com/wxdenixx/majestic-admin-tool-data)"
timeout_seconds: 60
retry_attempts: 3
retry_backoff_seconds: [10, 30, 60]

# challenge_wait_selector = CSS-селектор, который появляется на странице
# после того как R3ACTLB-cookie установлена и сервер отдал настоящий HTML
# треда, а не JS-заглушку.
challenge_wait_selector: "article.message .bbWrapper"

